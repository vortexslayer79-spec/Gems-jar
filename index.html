<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gems Jar</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .glass-jar-reflection {
      background: linear-gradient(105deg, 
        rgba(255, 255, 255, 0.25) 0%, 
        rgba(255, 255, 255, 0.08) 25%, 
        rgba(255, 255, 255, 0.0) 45%, 
        rgba(255, 255, 255, 0.12) 85%, 
        rgba(255, 255, 255, 0.28) 100%);
    }

    .jar-outline {
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .glow-purple {
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
    }

    /* Custom scrollbar for sleek look */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 transition-colors duration-300">

  <!-- TOP HEADER & CONTROLS -->
  <header class="w-full max-w-xl flex items-center justify-between py-3 px-4 rounded-2xl bg-slate-800/80 backdrop-blur border border-slate-700/60 shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl shadow-md">
        💎
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-300">
          Gems Jar
        </h1>
        <div id="save-status" class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Device Storage</span>
        </div>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <!-- Dark/Light Theme Toggle -->
      <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-700/80 hover:bg-slate-600 border border-slate-600/50 text-slate-200 transition-all active:scale-95" title="Toggle Light/Dark Theme">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="w-full max-w-xl my-auto flex flex-col items-center py-6">

    <!-- CAPACITY COUNTER CARD -->
    <div class="w-full bg-slate-800/60 border border-slate-700/50 backdrop-blur rounded-2xl p-4 mb-6 shadow-xl flex flex-col items-center">
      <div class="w-full flex justify-between items-center mb-2 px-1">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Jar Capacity</span>
        <span id="gem-count-label" class="text-sm font-extrabold text-cyan-400">0 / 50 Gems</span>
      </div>
      
      <!-- Progress Bar -->
      <div class="w-full h-3.5 bg-slate-950/80 rounded-full overflow-hidden p-0.5 border border-slate-800/80 relative">
        <div id="progress-bar" class="h-full rounded-full bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-500 transition-all duration-300 w-0"></div>
      </div>

      <!-- Victory Banner (Hidden by default) -->
      <div id="victory-badge" class="hidden mt-3 px-4 py-1.5 rounded-full bg-gradient-to-r from-amber-500 to-pink-500 text-white font-extrabold text-xs tracking-wider uppercase animate-bounce shadow-lg">
        🎉 Jar Completely Filled! 🎉
      </div>
    </div>

    <!-- CANVAS JAR CONTAINER -->
    <div class="relative w-full max-w-[340px] aspect-[3/4] flex items-center justify-center my-2">
      
      <!-- Glass Jar Visual Canvas Overlay -->
      <canvas id="physics-canvas" class="w-full h-full rounded-b-[3.5rem] rounded-t-[1.5rem] jar-outline relative z-10 cursor-pointer"></canvas>

      <!-- Glass Reflection Overlay -->
      <div class="absolute inset-0 rounded-b-[3.5rem] rounded-t-[1.5rem] glass-jar-reflection pointer-events-none z-20 border-2 border-white/20"></div>

      <!-- Jar Rim Accent -->
      <div class="absolute -top-3 w-[82%] h-6 rounded-full bg-slate-700/40 border-2 border-white/30 backdrop-blur z-20 shadow-md"></div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="w-full grid grid-cols-4 gap-2.5 mt-6">
      <button id="btn-sub-10" class="py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 font-bold rounded-xl shadow-md transition-all">
        -10
      </button>
      <button id="btn-sub-1" class="py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 border border-slate-700 font-bold rounded-xl shadow-md transition-all">
        -1
      </button>
      <button id="btn-add-1" class="py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 active:scale-95 text-white font-extrabold rounded-xl shadow-md transition-all">
        +1
      </button>
      <button id="btn-add-10" class="py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white font-extrabold rounded-xl shadow-md transition-all">
        +10
      </button>
    </div>

    <!-- BOTTOM CONTROL BAR -->
    <div class="w-full flex gap-3 mt-3">
      <button id="btn-reset" class="flex-1 py-2.5 bg-slate-800/80 hover:bg-rose-950/40 hover:text-rose-300 hover:border-rose-800/50 text-slate-400 border border-slate-700/80 font-semibold text-sm rounded-xl transition-all">
        Reset Jar
      </button>
      <button id="btn-save" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-sm rounded-xl border border-emerald-500 shadow-md transition-all flex items-center justify-center gap-1.5">
        💾 Save
      </button>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="text-xs text-slate-500 text-center py-2">
    Capacity Limit: 50 Gems Max • Automatic Local Backup Enabled
  </footer>

  <!-- APPLICATION LOGIC & CANVAS ENGINE -->
  <script>
    // --- EMBEDDED STATE (In-Code Architecture) ---
    const INITIAL_EMBEDDED_STATE = {
      gemCount: 0,
      maxGems: 50
    };

    // --- APPLICATION VARIABLES ---
    let currentGemCount = INITIAL_EMBEDDED_STATE.gemCount;
    const MAX_GEMS = 50;
    let isDarkMode = true;

    // --- GEM COLOR PALETTE ---
    const GEM_PALETTES = [
      { name: 'Diamond White', primary: '#f8fafc', secondary: '#cbd5e1', accent: '#ffffff' },
      { name: 'Ruby Red',       primary: '#ef4444', secondary: '#991b1b', accent: '#fca5a5' },
      { name: 'Sapphire Blue',  primary: '#3b82f6', secondary: '#1e3a8a', accent: '#93c5fd' },
      { name: 'Emerald Green',  primary: '#10b981', secondary: '#064e3b', accent: '#6ee7b7' },
      { name: 'Amethyst Purple',primary: '#a855f7', secondary: '#581c87', accent: '#e9d5ff' },
      { name: 'Topaz Amber',    primary: '#f59e0b', secondary: '#78350f', accent: '#fde68a' },
      { name: 'Pink Spinel',   primary: '#ec4899', secondary: '#831843', accent: '#fbcfe8' }
    ];

    // --- AUDIO SYNTHESIZER (Web Audio API) ---
    let audioCtx = null;
    function playChimeSound(freq = 520, duration = 0.15) {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + duration);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Audio fallback if muted/unsupported
      }
    }

    function playCelebrationChime() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playChimeSound(freq, 0.3), idx * 90);
      });
    }

    // --- 2D PHYSICS SIMULATION ---
    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');

    let gems = [];
    let animationFrameId = null;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    class Gem {
      constructor(x, y) {
        this.radius = 11 + Math.random() * 4;
        this.x = x || (canvas.width / window.devicePixelRatio / 2 + (Math.random() * 20 - 10));
        this.y = y || 30;
        this.vx = (Math.random() - 0.5) * 4;
        this.vy = Math.random() * 2 + 1;
        this.gravity = 0.38;
        this.bounce = 0.42;
        this.friction = 0.96;
        this.rotation = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.1;
        this.palette = GEM_PALETTES[Math.floor(Math.random() * GEM_PALETTES.length)];
      }

      update(width, height) {
        this.vy += this.gravity;
        this.vx *= this.friction;
        this.vy *= this.friction;

        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot;

        // Wall Collisions
        const margin = 20;
        if (this.x - this.radius < margin) {
          this.x = margin + this.radius;
          this.vx *= -this.bounce;
        }
        if (this.x + this.radius > width - margin) {
          this.x = width - margin - this.radius;
          this.vx *= -this.bounce;
        }

        // Bottom Boundary
        const bottomMargin = 25;
        if (this.y + this.radius > height - bottomMargin) {
          this.y = height - bottomMargin - this.radius;
          this.vy *= -this.bounce;
          this.vx *= 0.8;
          if (Math.abs(this.vy) < 0.5) this.vy = 0;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        const r = this.radius;

        // Gem Facet Geometry
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.8, -r * 0.4);
        ctx.lineTo(r * 0.6, r * 0.8);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.6, r * 0.8);
        ctx.lineTo(-r * 0.8, -r * 0.4);
        ctx.closePath();

        // Fill with Facet Gradient
        const grad = ctx.createLinearGradient(-r, -r, r, r);
        grad.addColorStop(0, this.palette.accent);
        grad.addColorStop(0.5, this.palette.primary);
        grad.addColorStop(1, this.palette.secondary);
        ctx.fillStyle = grad;
        ctx.fill();

        // Outer Highlight Edge
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Inner Facet Reflection Lines
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(0, r);
        ctx.moveTo(-r * 0.8, -r * 0.4);
        ctx.lineTo(r * 0.8, -r * 0.4);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.stroke();

        ctx.restore();
      }
    }

    function checkGemCollisions() {
      for (let i = 0; i < gems.length; i++) {
        for (let j = i + 1; j < gems.length; j++) {
          const g1 = gems[i];
          const g2 = gems[j];
          const dx = g2.x - g1.x;
          const dy = g2.y - g1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = g1.radius + g2.radius;

          if (dist < minDist && dist > 0) {
            const overlap = (minDist - dist) / 2;
            const nx = dx / dist;
            const ny = dy / dist;

            g1.x -= nx * overlap;
            g1.y -= ny * overlap;
            g2.x += nx * overlap;
            g2.y += ny * overlap;

            const k = g1.vx - g2.vx;
            const p = 2 * (nx * k + ny * (g1.vy - g2.vy)) / 2;
            g1.vx -= p * nx * 0.5;
            g1.vy -= p * ny * 0.5;
            g2.vx += p * nx * 0.5;
            g2.vy += p * ny * 0.5;
          }
        }
      }
    }

    function renderLoop() {
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;

      ctx.clearRect(0, 0, w, h);

      // Update & Draw Gems
      checkGemCollisions();
      gems.forEach(gem => {
        gem.update(w, h);
        gem.draw(ctx);
      });

      animationFrameId = requestAnimationFrame(renderLoop);
    }

    // --- UI UPDATERS & STATE MANAGEMENT ---
    function updateGemCount(targetAmount) {
      const clampedAmount = Math.max(0, Math.min(MAX_GEMS, targetAmount));
      const difference = clampedAmount - currentGemCount;

      if (difference > 0) {
        // Add Gems
        for (let i = 0; i < difference; i++) {
          setTimeout(() => {
            gems.push(new Gem());
            playChimeSound(400 + Math.random() * 300, 0.12);
          }, i * 40);
        }
      } else if (difference < 0) {
        // Remove Gems
        for (let i = 0; i < Math.abs(difference); i++) {
          if (gems.length > 0) gems.pop();
        }
        playChimeSound(250, 0.1);
      }

      currentGemCount = clampedAmount;
      syncUI();

      // Check Victory Condition
      if (currentGemCount === MAX_GEMS && difference > 0) {
        triggerVictoryCelebration();
      }
    }

    function syncUI() {
      // Update Counter Label
      document.getElementById('gem-count-label').innerText = `${currentGemCount} / ${MAX_GEMS} Gems`;

      // Update Progress Bar Width
      const percent = (currentGemCount / MAX_GEMS) * 100;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      // Button State Enforcements
      document.getElementById('btn-sub-1').disabled = currentGemCount <= 0;
      document.getElementById('btn-sub-10').disabled = currentGemCount <= 0;
      document.getElementById('btn-add-1').disabled = currentGemCount >= MAX_GEMS;
      document.getElementById('btn-add-10').disabled = currentGemCount >= MAX_GEMS;

      // Victory Badge Visibility
      const victoryBadge = document.getElementById('victory-badge');
      if (currentGemCount === MAX_GEMS) {
        victoryBadge.classList.remove('hidden');
      } else {
        victoryBadge.classList.add('hidden');
      }
    }

    function triggerVictoryCelebration() {
      playCelebrationChime();
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // --- SAVE LOGIC ---
    function saveProgress() {
      // 1. Local Storage Backup
      localStorage.setItem('gems_jar_count', currentGemCount);

      // 2. In-Code State Syncing
      INITIAL_EMBEDDED_STATE.gemCount = currentGemCount;

      // 3. User Feedback Status Banner
      const statusEl = document.getElementById('save-status');
      statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="text-emerald-400 font-bold">Saved!</span>`;

      playChimeSound(800, 0.2);

      setTimeout(() => {
        statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>Device Storage</span>`;
      }, 2000);
    }

    function loadSavedProgress() {
      const storedCount = localStorage.getItem('gems_jar_count');
      if (storedCount !== null) {
        const parsed = parseInt(storedCount, 10);
        if (!isNaN(parsed)) {
          currentGemCount = Math.max(0, Math.min(MAX_GEMS, parsed));
        }
      }

      // Populate physics gems
      gems = [];
      const w = canvas.width / window.devicePixelRatio;
      const h = canvas.height / window.devicePixelRatio;

      for (let i = 0; i < currentGemCount; i++) {
        const gem = new Gem(
          40 + Math.random() * (w - 80),
          h - 30 - Math.random() * (i * 4 + 10)
        );
        gem.vy = 0;
        gems.push(gem);
      }

      syncUI();
    }

    // --- THEME TOGGLE (Light/Dark Mode) ---
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      const body = document.body;
      const themeIcon = document.getElementById('theme-icon');

      if (isDarkMode) {
        body.classList.remove('bg-slate-100', 'text-slate-900');
        body.classList.add('bg-slate-900', 'text-slate-100');
        themeIcon.innerText = '🌙';
      } else {
        body.classList.remove('bg-slate-900', 'text-slate-100');
        body.classList.add('bg-slate-100', 'text-slate-900');
        themeIcon.innerText = '☀️';
      }
    }

    // --- EVENT LISTENERS ---
    document.getElementById('btn-add-1').addEventListener('click', () => updateGemCount(currentGemCount + 1));
    document.getElementById('btn-add-10').addEventListener('click', () => updateGemCount(currentGemCount + 10));
    document.getElementById('btn-sub-1').addEventListener('click', () => updateGemCount(currentGemCount - 1));
    document.getElementById('btn-sub-10').addEventListener('click', () => updateGemCount(currentGemCount - 10));
    
    document.getElementById('btn-reset').addEventListener('click', () => {
      updateGemCount(0);
      gems = [];
    });

    document.getElementById('btn-save').addEventListener('click', saveProgress);
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    // Canvas Click Drop
    canvas.addEventListener('click', (e) => {
      if (currentGemCount < MAX_GEMS) {
        const rect = canvas.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const gem = new Gem(clickX, 20);
        gems.push(gem);
        currentGemCount++;
        syncUI();
        playChimeSound(450, 0.12);
        if (currentGemCount === MAX_GEMS) triggerVictoryCelebration();
      }
    });

    // Initialize Application
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      loadSavedProgress();
      renderLoop();
    });
  </script>
</body>
</html>
